name: Continuous Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build Image & Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [ ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        run: |
          docker build -t stradit-emperp:${{ github.sha }} .
          docker tag stradit-emperp:${{ github.sha }} stradit-emperp:latest

      # Note: For production AWS deployment, configure AWS OIDC Credentials & ECR Login below:
      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsECRDeployRole
      #     aws-region: us-east-1

      # - name: Log in to Amazon ECR
      #   id: login-ecr
      #   uses: aws-actions/amazon-ecr-login@v2

      # - name: Push Docker Image to ECR
      #   run: |
      #     docker tag stradit-emperp:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/emperp:${{ github.sha }}
      #     docker push ${{ steps.login-ecr.outputs.registry }}/emperp:${{ github.sha }}

      - name: Deployment Instructions Summary
        run: |
          echo "Build completed successfully for commit ${{ github.sha }}."
          echo "Automated SSH deployment step can execute: docker compose pull && alembic upgrade head && docker compose up -d"
