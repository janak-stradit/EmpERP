<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stradit Workforce &mdash; Projects</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar emp-navbar mb-4">
    <div class="container">
      <a class="navbar-brand" href="/dashboard"><i class="bi bi-buildings me-2"></i><span>Stradit Workforce</span></a>
      <button class="emp-navbar-toggler ms-auto" id="empNavToggler" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>
      <div class="emp-navbar-collapse" id="empNavCollapse">
        <a class="nav-link" href="/dashboard"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </div>
  </nav>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <div class="container pb-5">
    <a href="/dashboard" class="btn btn-sm btn-link ps-0 mb-2"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>

    <div class="emp-page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h1><i class="bi bi-kanban me-2"></i>Projects</h1>
        <p>Pick a project to view its tickets, or create a new one to start tracking work.</p>
      </div>
      <div class="d-flex gap-2">
        <a href="/tickets/board" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-columns-gap me-1"></i>All Tickets Board
        </a>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newProjectModal">
          <i class="bi bi-plus-lg me-1"></i>New Project
        </button>
      </div>
    </div>

    <div class="row g-3" id="projectRow"></div>
    <div id="emptyState" class="emp-empty-state d-none">
      <i class="bi bi-kanban display-6 d-block mb-2"></i>
      No projects yet. Create one to get started.
    </div>
  </div>

  <!-- New Project Modal -->
  <div class="modal fade" id="newProjectModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="newProjectForm">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-plus-lg me-1"></i>New Project</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small">Project name</label>
              <input type="text" class="form-control" id="newProjectName" required>
            </div>
            <div class="mb-3">
              <label class="form-label small">Project key</label>
              <input type="text" class="form-control text-uppercase" id="newProjectKey" maxlength="10" placeholder="e.g. DEV" required>
              <div class="form-text">Used as the prefix for ticket ids, e.g. DEV-001. Letters and numbers only.</div>
            </div>
            <div class="mb-0">
              <label class="form-label small">Description (optional)</label>
              <textarea class="form-control" id="newProjectDescription" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Create Project</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app-ux.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/static/js/notifications.js"></script>
  <script nonce="{{ csp_nonce }}">
    const token = sessionStorage.getItem('access_token');
    if (!token) { window.location.href = '/auth/login'; }
    const authHeader = { Authorization: 'Bearer ' + token };

    function showToast(message, variant) {
      const bg = variant === 'success' ? 'text-bg-success' : 'text-bg-danger';
      const icon = variant === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle';
      const toastEl = $(
        '<div class="toast align-items-center ' + bg + ' border-0" role="alert">' +
          '<div class="d-flex">' +
            '<div class="toast-body"><i class="bi ' + icon + ' me-2"></i>' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>' +
          '</div>' +
        '</div>'
      );
      $('#toastContainer').append(toastEl);
      const toast = new bootstrap.Toast(toastEl[0], { delay: 4000 });
      toast.show();
      toastEl.on('hidden.bs.toast', function () { toastEl.remove(); });
    }
    function showError(message) { showToast(message, 'danger'); }
    function showSuccess(message) { showToast(message, 'success'); }

    function escapeHtml(str) {
      return $('<div>').text(str == null ? '' : str).html();
    }

    function loadProjects() {
      $.ajax({ url: '/api/v1/projects', headers: authHeader }).done(function (projects) {
        $('#emptyState').toggleClass('d-none', projects.length > 0);
        $('#projectRow').html(projects.map(function (p) {
          return '<div class="col-md-6 col-lg-4">' +
            '<a class="emp-tile" href="/tickets/project/' + p.id + '">' +
              '<div class="card h-100 card-accent-primary">' +
                '<div class="card-body">' +
                  '<div class="emp-tile-arrow"><i class="bi bi-arrow-right-short"></i></div>' +
                  '<div class="d-flex align-items-center gap-2 mb-2">' +
                    '<span class="badge bg-secondary">' + escapeHtml(p.key) + '</span>' +
                    (p.is_active ? '' : '<span class="badge bg-light text-muted border">Inactive</span>') +
                  '</div>' +
                  '<h5 class="card-title mb-1">' + escapeHtml(p.name) + '</h5>' +
                  '<p class="text-muted small mb-2">' + escapeHtml(p.description || 'No description') + '</p>' +
                  '<div class="text-muted small"><i class="bi bi-ticket-detailed me-1"></i>' + p.open_ticket_count + ' open ticket' + (p.open_ticket_count === 1 ? '' : 's') + '</div>' +
                '</div>' +
              '</div>' +
            '</a>' +
          '</div>';
        }).join(''));
      }).fail(function (xhr) { showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to load projects.'); });
    }

    $('#newProjectForm').on('submit', function (e) {
      e.preventDefault();
      $.ajax({
        url: '/api/v1/projects', method: 'POST', contentType: 'application/json', headers: authHeader,
        data: JSON.stringify({
          name: $('#newProjectName').val(),
          key: $('#newProjectKey').val(),
          description: $('#newProjectDescription').val() || null
        })
      }).done(function (project) {
        bootstrap.Modal.getInstance(document.getElementById('newProjectModal')).hide();
        $('#newProjectForm')[0].reset();
        showSuccess('Project created.');
        window.location.href = '/tickets/project/' + project.id;
      }).fail(function (xhr) { showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to create project.'); });
    });

    loadProjects();

    $('#logoutLink').on('click', function (e) {
      e.preventDefault();
      sessionStorage.clear();
      window.location.href = '/auth/login';
    });
  </script>
</body>
</html>
