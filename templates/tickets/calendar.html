<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stradit Workforce &mdash; Calendar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
  <style nonce="{{ csp_nonce }}">
    #viewTabs.nav-pills .nav-link { font-size: .8rem; font-weight: 700; color: var(--emp-text-muted); padding: .4rem .9rem; border: 1px solid transparent; }
    #viewTabs.nav-pills .nav-link:hover { background: var(--emp-secondary-light); }
    #viewTabs.nav-pills .nav-link.active { background: var(--emp-primary); color: #fff; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-dow { text-align: center; font-weight: 600; font-size: .75rem; color: #6c757d; padding: .25rem 0; }
    .cal-cell { min-height: 110px; background: var(--emp-surface); border: 1px solid var(--emp-border); padding: .35rem; }
    .cal-cell.outside { background: var(--bs-tertiary-bg, #f4f5f7); opacity: .6; }
    .cal-cell.today { border-color: #0d6efd; border-width: 2px; }
    .cal-date { font-size: .75rem; font-weight: 600; color: #495057; margin-bottom: .25rem; }
    .cal-event { font-size: .7rem; padding: .15rem .35rem; margin-bottom: .2rem; color: #fff; cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .sortable-ghost { opacity: .4; }
  </style>
</head>
<body>
  <nav class="navbar emp-navbar mb-4">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/dashboard"><i class="bi bi-buildings me-2"></i><span>Stradit Workforce</span></a>
      <button class="emp-navbar-toggler ms-auto" id="empNavToggler" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>
      <div class="emp-navbar-collapse" id="empNavCollapse">
        <a class="nav-link" href="/dashboard"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </div>
  </nav>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <div class="container-fluid px-4 pb-5">
    <a href="/tickets" class="btn btn-sm btn-link ps-0 mb-2"><i class="bi bi-arrow-left me-1"></i>All Projects</a>

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
      <div>
        <span class="badge bg-secondary" id="projectKeyBadge">&mdash;</span>
        <h3 class="d-inline ms-2" id="projectName"></h3>
      </div>
    </div>

    <ul class="nav nav-pills mb-3" id="viewTabs"></ul>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-secondary" id="prevMonthBtn"><i class="bi bi-chevron-left"></i></button>
        <button class="btn btn-outline-secondary" id="todayBtn">Today</button>
        <button class="btn btn-outline-secondary" id="nextMonthBtn"><i class="bi bi-chevron-right"></i></button>
      </div>
      <h5 class="mb-0" id="monthLabel"></h5>
      <span class="text-muted small">Colored by status &middot; drag a card to reschedule</span>
    </div>

    <div class="cal-grid mb-2">
      <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div><div class="cal-dow">Wed</div>
      <div class="cal-dow">Thu</div><div class="cal-dow">Fri</div><div class="cal-dow">Sat</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app-ux.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/static/js/notifications.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script nonce="{{ csp_nonce }}">
    const token = sessionStorage.getItem('access_token');
    if (!token) { window.location.href = '/auth/login'; }
    const authHeader = { Authorization: 'Bearer ' + token };
    const projectId = {{ project_id }};

    function showToast(message, variant) {
      const bg = variant === 'success' ? 'text-bg-success' : 'text-bg-danger';
      const icon = variant === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle';
      const toastEl = $(
        '<div class="toast align-items-center ' + bg + ' border-0" role="alert">' +
          '<div class="d-flex">' +
            '<div class="toast-body"><i class="bi ' + icon + ' me-2"></i>' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>' +
          '</div>' +
        '</div>'
      );
      $('#toastContainer').append(toastEl);
      const toast = new bootstrap.Toast(toastEl[0], { delay: 4000 });
      toast.show();
      toastEl.on('hidden.bs.toast', function () { toastEl.remove(); });
    }
    function showError(message) { showToast(message, 'danger'); }
    function escapeHtml(str) { return $('<div>').text(str == null ? '' : str).html(); }
    function pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function isoDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

    $('#viewTabs').html(
      ['Board', 'List', 'Backlog', 'Calendar', 'Dashboard'].map(function (v) {
        const url = v === 'List' ? '/tickets/project/' + projectId : '/tickets/project/' + projectId + '/' + v.toLowerCase();
        const active = v === 'Calendar' ? ' active' : '';
        return '<li class="nav-item"><a class="nav-link' + active + '" href="' + url + '">' + v + '</a></li>';
      }).join('')
    );

    let viewDate = new Date();
    let allTickets = [];

    function loadProject() {
      $.ajax({ url: '/api/v1/projects/' + projectId, headers: authHeader }).done(function (p) {
        $('#projectKeyBadge').text(p.key);
        $('#projectName').text(p.name);
        document.title = 'Stradit Workforce — ' + p.name + ' Calendar';
      });
    }

    function loadTickets() {
      $.ajax({ url: '/api/v1/tickets', data: { project_id: projectId, page_size: 100 }, headers: authHeader }).done(function (tickets) {
        allTickets = tickets;
        renderCalendar();
      }).fail(function (xhr) { showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to load tickets.'); });
    }

    function renderCalendar() {
      const year = viewDate.getFullYear(), month = viewDate.getMonth();
      $('#monthLabel').text(viewDate.toLocaleString('default', { month: 'long', year: 'numeric' }));

      const firstOfMonth = new Date(year, month, 1);
      const startOffset = firstOfMonth.getDay();
      const gridStart = new Date(year, month, 1 - startOffset);
      const todayIso = isoDate(new Date());

      const ticketsByDate = {};
      allTickets.forEach(function (t) {
        if (!t.due_date) return;
        (ticketsByDate[t.due_date] = ticketsByDate[t.due_date] || []).push(t);
      });

      let html = '';
      for (let i = 0; i < 42; i++) {
        const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
        const cellIso = isoDate(cellDate);
        const outside = cellDate.getMonth() !== month;
        const events = ticketsByDate[cellIso] || [];
        html += '<div class="cal-cell' + (outside ? ' outside' : '') + (cellIso === todayIso ? ' today' : '') + '" data-date="' + cellIso + '">' +
          '<div class="cal-date">' + cellDate.getDate() + '</div>' +
          '<div class="cal-events" data-date="' + cellIso + '">' +
          events.map(function (t) {
            return '<div class="cal-event" data-id="' + t.id + '" style="background-color:' + t.status.color + ';" title="' + escapeHtml(t.ticket_key + ': ' + t.summary) + '">' +
              escapeHtml(t.ticket_key) + ' ' + escapeHtml(t.summary) + '</div>';
          }).join('') +
          '</div>' +
        '</div>';
        if (i >= 34 && cellDate.getMonth() !== month && (i + 1) % 7 === 0) break; // trim trailing all-outside weeks
      }
      $('#calGrid').html(html);

      document.querySelectorAll('.cal-events').forEach(function (el) {
        new Sortable(el, {
          group: 'calendar',
          animation: 150,
          ghostClass: 'sortable-ghost',
          onStart: function () { justDragged = true; },
          onEnd: function (evt) {
            setTimeout(function () { justDragged = false; }, 200);
            const ticketId = parseInt(evt.item.getAttribute('data-id'), 10);
            const newDate = evt.to.getAttribute('data-date');
            $.ajax({
              url: '/api/v1/tickets/' + ticketId, method: 'PUT', contentType: 'application/json', headers: authHeader,
              data: JSON.stringify({ due_date: newDate })
            }).done(loadTickets)
              .fail(function (xhr) { showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to reschedule.'); loadTickets(); });
          }
        });
      });
    }

    let justDragged = false;
    $(document).on('click', '.cal-event', function () {
      if (justDragged) return;
      window.location.href = '/tickets/' + $(this).data('id');
    });

    $('#prevMonthBtn').on('click', function () { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1); renderCalendar(); });
    $('#nextMonthBtn').on('click', function () { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1); renderCalendar(); });
    $('#todayBtn').on('click', function () { viewDate = new Date(); renderCalendar(); });

    loadProject();
    loadTickets();

    $('#logoutLink').on('click', function (e) {
      e.preventDefault();
      sessionStorage.clear();
      window.location.href = '/auth/login';
    });
  </script>
</body>
</html>
