<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Stradit Workforce &mdash; Admin Password Recovery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <div class="emp-login-wrapper container-fluid py-5">
    <div class="row align-items-center justify-content-center" style="min-height: 90vh;">
      <div class="col-lg-5 col-md-7">
        <div class="card emp-login-card mx-auto" style="width: 100%; max-width: 440px;">
          <div class="card-body p-4 p-sm-5">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div>
                <h4 class="fw-bold mb-1">Admin Password Recovery</h4>
                <p class="text-muted small mb-0">Requires the deployment's bootstrap token</p>
              </div>
              <span class="badge emp-status emp-status-active">
                <span class="emp-status-dot"></span> Recovery
              </span>
            </div>

            <hr class="my-3 opacity-10">

            <form id="resetForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Super Admin Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" placeholder="admin@company.com" required autocomplete="username">
                </div>
              </div>
              <div class="mb-3">
                <label for="token" class="form-label">Bootstrap Token</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-key"></i></span>
                  <input type="password" class="form-control" id="token" placeholder="ADMIN_BOOTSTRAP_TOKEN" required autocomplete="off">
                </div>
              </div>
              <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required minlength="8" maxlength="72" autocomplete="new-password">
                </div>
              </div>
              <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                  <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required minlength="8" maxlength="72" autocomplete="new-password">
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="resetSubmit">
                <span class="spinner-border spinner-border-sm me-2 d-none" id="resetSpinner"></span>
                Reset Password
              </button>
              <a href="/auth/login" class="btn btn-link w-100 mt-2">Back to Sign In</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app-ux.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script nonce="{{ csp_nonce }}">
    function showToast(message, variant) {
      const bg = variant === 'success' ? 'text-bg-success' : 'text-bg-danger';
      const icon = variant === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle';
      const toastEl = $(
        '<div class="toast align-items-center ' + bg + ' border-0" role="alert">' +
          '<div class="d-flex">' +
            '<div class="toast-body"><i class="bi ' + icon + ' me-2"></i>' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>' +
          '</div>' +
        '</div>'
      );
      $('#toastContainer').append(toastEl);
      const toast = new bootstrap.Toast(toastEl[0], { delay: 5000 });
      toast.show();
      toastEl.on('hidden.bs.toast', function () { toastEl.remove(); });
    }

    function setLoading(isLoading) {
      $('#resetSubmit').prop('disabled', isLoading);
      $('#resetSpinner').toggleClass('d-none', !isLoading);
    }

    $('#resetForm').on('submit', function (e) {
      e.preventDefault();

      if ($('#newPassword').val() !== $('#confirmPassword').val()) {
        showToast('Passwords do not match.', 'danger');
        return;
      }

      setLoading(true);
      $.ajax({
        url: '/api/v1/auth/bootstrap-reset-password',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
          email: $('#email').val(),
          token: $('#token').val(),
          new_password: $('#newPassword').val()
        })
      }).done(function () {
        showToast('Password updated. Redirecting to sign in...', 'success');
        setTimeout(function () { window.location.href = '/auth/login'; }, 1500);
      }).fail(function (xhr) {
        showToast((xhr.responseJSON && xhr.responseJSON.detail) || 'Reset failed.', 'danger');
      }).always(function () {
        setLoading(false);
      });
    });
  </script>
</body>
</html>
