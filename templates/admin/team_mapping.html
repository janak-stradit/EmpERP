<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Mapping - Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar emp-navbar mb-4">
    <div class="container">
      <a class="navbar-brand" href="/dashboard"><i class="bi bi-buildings me-2"></i><span>Stradit Workforce</span></a>
      <button class="emp-navbar-toggler ms-auto" id="empNavToggler" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>
      <div class="emp-navbar-collapse" id="empNavCollapse">
        <a class="nav-link" href="/dashboard"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <a href="/dashboard" class="btn btn-sm btn-link ps-0 mb-2"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>

    <div class="emp-page-header">
      <h1>Team Mapping</h1>
      <p>Assign employees to their reporting managers for the Activity Tracker module.</p>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

    <div class="row">
      <div class="col-lg-4">
        <div class="card card-accent-primary mb-4">
          <div class="card-body">
            <h5 class="card-title"><i class="bi bi-diagram-3"></i> Assign Manager</h5>
            <form id="mappingForm" class="mt-3">
              <div class="mb-3">
                <label class="form-label">Employee</label>
                <select class="form-select" id="employeeId" required></select>
              </div>
              <div class="mb-3">
                <label class="form-label">Reporting Manager</label>
                <select class="form-select" id="managerId" required></select>
              </div>
              <button type="submit" class="btn btn-primary w-100">Save Mapping</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card card-accent-info mb-4">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-people"></i> Current Team Mappings</h5>
            <div class="table-responsive">
              <table class="table table-hover align-middle" id="mappingTable">
                <thead>
                  <tr>
                    <th>Employee</th>
                    <th>Reporting Manager</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Filled by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app-ux.js"></script>
  <script nonce="{{ csp_nonce }}">
    const authHeader = { 'Authorization': 'Bearer ' + sessionStorage.getItem('access_token') };
    if (!sessionStorage.getItem('access_token')) {
      window.location.href = '/auth/login';
    }
    
    function showToast(message, type = 'success') {
      if (window.EmpUX) { return EmpUX.showToast(message, type === 'danger' ? 'danger' : 'success'); }
      const bg = type === 'success' ? 'text-bg-success' : 'text-bg-danger';
      const html = `<div class="toast align-items-center ${bg} border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>`;
      const $toast = $(html).appendTo('#toastContainer');
      const toast = new bootstrap.Toast($toast[0], { delay: 3000 });
      toast.show();
      $toast.on('hidden.bs.toast', () => $toast.remove());
    }

    function loadEmployees() {
      $.ajax({ url: '/api/v1/employees', headers: authHeader }).done(function(data) {
        let options = '<option value="">Select...</option>';
        data.forEach(e => {
          const name = e.full_name || e.email || ('Employee #' + e.id);
          const code = e.employee_code ? `${e.employee_code} - ` : '';
          options += `<option value="${e.id}">${code}${name}</option>`;
        });
        $('#employeeId, #managerId').html(options);
      }).fail(function() {
        showToast('Failed to load employees', 'danger');
      });
    }

    function loadMappings() {
      $.ajax({ url: '/api/v1/teams/mappings', headers: authHeader }).done(function(data) {
        if(data.length === 0) {
          $('#mappingTable tbody').html('<tr><td colspan="2" class="text-center text-muted">No mappings found.</td></tr>');
          return;
        }
        let rows = '';
        data.forEach(m => {
          rows += `<tr>
            <td class="fw-bold">${m.employee_name}</td>
            <td>${m.manager_name}</td>
          </tr>`;
        });
        $('#mappingTable tbody').html(rows);
      });
    }

    $(document).ready(function() {
      loadEmployees();
      loadMappings();

      $('#mappingForm').on('submit', function(e) {
        e.preventDefault();
        
        const payload = {
          employee_id: parseInt($('#employeeId').val()),
          manager_id: parseInt($('#managerId').val())
        };

        $.ajax({
          url: '/api/v1/teams/map',
          method: 'POST',
          contentType: 'application/json',
          headers: authHeader,
          data: JSON.stringify(payload)
        }).done(function() {
          showToast('Team mapping saved successfully');
          $('#mappingForm')[0].reset();
          loadMappings();
        }).fail(function(xhr) {
          showToast((xhr.responseJSON && xhr.responseJSON.detail) || 'Error saving mapping', 'danger');
        });
      });

      $('#logoutLink').on('click', function(e) {
        e.preventDefault();
        sessionStorage.clear();
        window.location.href = '/auth/login';
      });
    });
  </script>
</body>
</html>
