<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stradit Workforce &mdash; My KRA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand emp-navbar mb-4">
    <div class="container">
      <span class="navbar-brand"><i class="bi bi-buildings me-2"></i>Stradit Workforce &mdash; My Workspace</span>
      <div class="navbar-nav">
        <a class="nav-link" href="/dashboard"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </div>
  </nav>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <div class="container pb-5">
    <a href="/dashboard" class="btn btn-sm btn-link ps-0 mb-2"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>

    <div class="emp-page-header">
      <h1>My KRA</h1>
      <p>Rate yourself against this cycle's key result areas, then submit for your manager's review.</p>
    </div>

    <div class="row g-3 mb-4" id="kraCards"></div>
    <div id="emptyState" class="emp-empty-state d-none">
      <i class="bi bi-bullseye display-6 d-block mb-2"></i>
      No KRA has been assigned to you yet. Contact HR.
    </div>
  </div>

  <!-- KRA detail offcanvas -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="kraPanel" style="width: 40rem; max-width: 95vw;">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="kraPanelTitle"><i class="bi bi-bullseye me-1"></i>KRA</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div id="kraPanelStatus" class="mb-3"></div>
      <div id="kraItems"></div>
      <button type="button" class="btn btn-primary w-100 mt-2 d-none" id="submitKraBtn">
        <i class="bi bi-send me-1"></i>Submit for Manager Review
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script nonce="{{ csp_nonce }}">
    const token = sessionStorage.getItem('access_token');
    if (!token) { window.location.href = '/auth/login'; }
    const authHeader = { Authorization: 'Bearer ' + token };

    let activeKraId = null;

    function showToast(message, variant) {
      const bg = variant === 'success' ? 'text-bg-success' : 'text-bg-danger';
      const icon = variant === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle';
      const toastEl = $(
        '<div class="toast align-items-center ' + bg + ' border-0" role="alert">' +
          '<div class="d-flex">' +
            '<div class="toast-body"><i class="bi ' + icon + ' me-2"></i>' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>' +
          '</div>' +
        '</div>'
      );
      $('#toastContainer').append(toastEl);
      const toast = new bootstrap.Toast(toastEl[0], { delay: 4000 });
      toast.show();
      toastEl.on('hidden.bs.toast', function () { toastEl.remove(); });
    }

    function showError(message) { showToast(message, 'danger'); }
    function showSuccess(message) { showToast(message, 'success'); }

    function statusLabel(status) {
      const labels = { draft: 'Draft &mdash; awaiting your rating', submitted: 'Submitted &mdash; awaiting manager review', reviewed: 'Reviewed &mdash; awaiting HR approval', approved: 'Approved' };
      return labels[status] || status;
    }

    function statusBadgeClass(status) {
      const classes = { draft: 'bg-secondary', submitted: 'bg-warning text-dark', reviewed: 'bg-info text-dark', approved: 'bg-success' };
      return classes[status] || 'bg-secondary';
    }

    function loadKras() {
      $.ajax({ url: '/api/v1/kra/me', headers: authHeader }).done(function (kras) {
        $('#emptyState').toggleClass('d-none', kras.length > 0);
        $('#kraCards').html(kras.map(function (k) {
          const score = k.overall_score !== null && k.overall_score !== undefined ? k.overall_score.toFixed(2) : '&mdash;';
          return '<div class="col-md-6 col-lg-4">' +
            '<div class="card h-100 kra-card" data-id="' + k.id + '" style="cursor: pointer;">' +
              '<div class="card-body">' +
                '<span class="badge ' + statusBadgeClass(k.status) + ' mb-2">' + statusLabel(k.status) + '</span>' +
                '<h5 class="card-title mb-1">' + k.cycle_name + '</h5>' +
                '<p class="text-muted small mb-1">' + k.template_name + '</p>' +
                '<div class="fs-5 fw-semibold">' + score + ' <span class="fs-6 text-muted">overall score</span></div>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join(''));
      }).fail(function (xhr) { showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to load your KRAs.'); });
    }

    function renderKraDetail(kra) {
      activeKraId = kra.id;
      $('#kraPanelTitle').html('<i class="bi bi-bullseye me-1"></i>' + kra.cycle_name);
      $('#kraPanelStatus').html('<span class="badge ' + statusBadgeClass(kra.status) + '">' + statusLabel(kra.status) + '</span>');

      const editable = kra.status === 'draft';
      $('#kraItems').html(kra.items.map(function (item) {
        const managerBlock = (item.manager_rating !== null && item.manager_rating !== undefined)
          ? '<div class="small text-muted mt-1">Manager rating: <strong>' + item.manager_rating + '</strong>' +
              (item.manager_comment ? ' &mdash; ' + item.manager_comment : '') + '</div>'
          : '';
        return '<div class="card mb-3"><div class="card-body">' +
          '<h6 class="mb-1">' + item.title + ' <span class="text-muted small">(' + item.weightage + '%)</span></h6>' +
          (item.description ? '<p class="text-muted small mb-2">' + item.description + '</p>' : '') +
          (item.target ? '<p class="small mb-2"><strong>Target:</strong> ' + item.target + '</p>' : '') +
          '<div class="row g-2">' +
            '<div class="col-4">' +
              '<label class="form-label small mb-0">Self rating (1-5)</label>' +
              '<input type="number" min="1" max="5" step="0.5" class="form-control form-control-sm kra-rating" data-item-id="' + item.id + '" value="' + (item.employee_rating !== null && item.employee_rating !== undefined ? item.employee_rating : '') + '" ' + (editable ? '' : 'disabled') + '>' +
            '</div>' +
            '<div class="col-8">' +
              '<label class="form-label small mb-0">Comment</label>' +
              '<input type="text" class="form-control form-control-sm kra-comment" data-item-id="' + item.id + '" value="' + (item.employee_comment || '').replace(/"/g, '&quot;') + '" ' + (editable ? '' : 'disabled') + '>' +
            '</div>' +
          '</div>' +
          managerBlock +
        '</div></div>';
      }).join(''));

      $('#submitKraBtn').toggleClass('d-none', !editable);
    }

    $(document).on('click', '.kra-card', function () {
      const id = $(this).data('id');
      $.ajax({ url: '/api/v1/kra/' + id, headers: authHeader })
        .done(function (kra) {
          renderKraDetail(kra);
          new bootstrap.Offcanvas('#kraPanel').show();
        })
        .fail(function (xhr) { showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to load KRA.'); });
    });

    function saveSelfRatings(onSuccess) {
      const items = [];
      $('.kra-rating').each(function () {
        const rating = parseFloat($(this).val());
        if (!isNaN(rating)) {
          items.push({
            item_id: parseInt($(this).data('item-id'), 10),
            rating: rating,
            comment: $('.kra-comment[data-item-id="' + $(this).data('item-id') + '"]').val() || null
          });
        }
      });
      if (items.length === 0) { showError('Rate at least one item before saving.'); return; }
      $.ajax({
        url: '/api/v1/kra/' + activeKraId + '/self-rating', method: 'PUT', contentType: 'application/json',
        headers: authHeader, data: JSON.stringify({ items: items })
      }).done(function () {
        if (onSuccess) onSuccess();
      }).fail(function (xhr) { showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to save ratings.'); });
    }

    $('#submitKraBtn').on('click', function () {
      saveSelfRatings(function () {
        $.ajax({ url: '/api/v1/kra/' + activeKraId + '/submit', method: 'POST', headers: authHeader })
          .done(function () {
            bootstrap.Offcanvas.getInstance(document.getElementById('kraPanel')).hide();
            loadKras();
            showSuccess('KRA submitted for manager review.');
          })
          .fail(function (xhr) { showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to submit KRA. Make sure every item is rated.'); });
      });
    });

    loadKras();

    $('#logoutLink').on('click', function (e) {
      e.preventDefault();
      sessionStorage.clear();
      window.location.href = '/auth/login';
    });
  </script>
</body>
</html>
