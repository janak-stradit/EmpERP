<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stradit Workforce &mdash; Activity Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand emp-navbar mb-4">
    <div class="container">
      <span class="navbar-brand"><i class="bi bi-buildings me-2"></i>Stradit Workforce &mdash; My Workspace</span>
      <div class="navbar-nav">
        <a class="nav-link" href="/dashboard"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <a href="/dashboard" class="btn btn-sm btn-link ps-0 mb-2"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>

    <div class="emp-page-header">
      <h1>Daily Activity Tracker</h1>
      <p>Log your daily tasks in 30-minute blocks.</p>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

    <div class="row">
      <div class="col-lg-4">
        <div class="card card-accent-primary mb-4">
          <div class="card-body">
            <h5 class="card-title"><i class="bi bi-plus-circle"></i> Log Time Block</h5>
            <form id="activityForm" class="mt-3">
              <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" id="logDate" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Time Block</label>
                <input type="time" class="form-control" id="timeBlock" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" id="categoryId" required></select>
              </div>
              <div class="mb-3">
                <label class="form-label">Duration (minutes)</label>
                <input type="number" class="form-control" id="durationMinutes" value="30" required>
              </div>
              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="isOvertime">
                <label class="form-check-label" for="isOvertime">Mark as Overtime</label>
              </div>
              <div class="mb-3">
                <label class="form-label">Notes (optional)</label>
                <input type="text" class="form-control" id="notes">
              </div>
              <button type="submit" class="btn btn-primary w-100">Log Activity</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card card-accent-info mb-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-title mb-0"><i class="bi bi-list-task"></i> My Activities (This Week)</h5>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle" id="activitiesTable">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Category</th>
                    <th>Duration</th>
                    <th>Type</th>
                    <th>Notes</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Filled by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script nonce="{{ csp_nonce }}">
    const authHeader = { 'Authorization': 'Bearer ' + sessionStorage.getItem('access_token') };
    if (!sessionStorage.getItem('access_token')) {
      window.location.href = '/auth/login';
    }

    function showToast(message, type = 'success') {
      const bg = type === 'success' ? 'text-bg-success' : 'text-bg-danger';
      const html = `<div class="toast align-items-center ${bg} border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>`;
      const $toast = $(html).appendTo('#toastContainer');
      const toast = new bootstrap.Toast($toast[0], { delay: 3000 });
      toast.show();
      $toast.on('hidden.bs.toast', () => $toast.remove());
    }

    function loadCategories() {
      $.ajax({ url: '/api/v1/activities/categories', headers: authHeader }).done(function(data) {
        let options = '<option value="">Select Category</option>';
        data.forEach(c => options += `<option value="${c.id}">${c.name}</option>`);
        $('#categoryId').html(options);
      });
    }

    function getStartOfWeek() {
      const d = new Date();
      const day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
      return new Date(d.setDate(diff)).toISOString().split('T')[0];
    }
    
    function getEndOfWeek() {
      const d = new Date();
      const day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1) + 6;
      return new Date(d.setDate(diff)).toISOString().split('T')[0];
    }

    function loadActivities() {
      const start = getStartOfWeek();
      const end = getEndOfWeek();
      $.ajax({ url: `/api/v1/activities/me?start_date=${start}&end_date=${end}`, headers: authHeader }).done(function(data) {
        if(data.length === 0) {
          $('#activitiesTable tbody').html('<tr><td colspan="6" class="text-center text-muted">No activities logged this week.</td></tr>');
          return;
        }
        let rows = '';
        data.forEach(log => {
          const catName = log.category ? log.category.name : 'Unknown';
          const typeBadge = log.is_overtime ? '<span class="badge bg-warning text-dark">Overtime</span>' : '<span class="badge bg-success">Regular</span>';
          rows += `<tr>
            <td>${log.log_date}</td>
            <td>${log.time_block.substring(0, 5)}</td>
            <td>${catName}</td>
            <td>${log.duration_minutes}m</td>
            <td>${typeBadge}</td>
            <td>${log.notes || ''}</td>
          </tr>`;
        });
        $('#activitiesTable tbody').html(rows);
      });
    }

    $(document).ready(function() {
      $('#logDate').val(new Date().toISOString().split('T')[0]);
      
      loadCategories();
      loadActivities();

      $('#activityForm').on('submit', function(e) {
        e.preventDefault();
        
        let timeVal = $('#timeBlock').val();
        if (timeVal.split(':').length === 2) {
          timeVal += ':00';
        }
        
        const payload = {
          category_id: parseInt($('#categoryId').val()),
          log_date: $('#logDate').val(),
          time_block: timeVal,
          duration_minutes: parseInt($('#durationMinutes').val()),
          is_overtime: $('#isOvertime').is(':checked'),
          notes: $('#notes').val() || null
        };

        $.ajax({
          url: '/api/v1/activities/log',
          method: 'POST',
          contentType: 'application/json',
          headers: authHeader,
          data: JSON.stringify(payload)
        }).done(function() {
          showToast('Activity logged successfully');
          $('#notes').val('');
          loadActivities();
        }).fail(function(xhr) {
          showToast((xhr.responseJSON && xhr.responseJSON.detail) || 'Error logging activity', 'danger');
        });
      });

      $('#logoutLink').on('click', function(e) {
        e.preventDefault();
        sessionStorage.clear();
        window.location.href = '/auth/login';
      });
    });
  </script>
</body>
</html>
