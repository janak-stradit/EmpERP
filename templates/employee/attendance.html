<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stradit Workforce &mdash; My Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar emp-navbar mb-4">
    <div class="container">
      <a class="navbar-brand" href="/dashboard"><i class="bi bi-buildings me-2"></i><span>Stradit Workforce</span></a>
      <button class="emp-navbar-toggler ms-auto" id="empNavToggler" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>
      <div class="emp-navbar-collapse" id="empNavCollapse">
        <a class="nav-link" href="/dashboard"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </div>
  </nav>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <div class="container pb-5">
    <a href="/dashboard" class="btn btn-sm btn-link ps-0 mb-2"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>

    <div class="emp-page-header">
      <h1>My Attendance</h1>
      <p>Clock in/out, review your timesheet, and request corrections for missed punches.</p>
    </div>

    <div class="card mb-4">
      <div class="card-body text-center py-4">
        <div class="text-muted small mb-1">Today</div>
        <div class="fs-3 fw-semibold mb-3" id="todayStatus">Loading...</div>
        <button class="btn btn-primary btn-lg px-5" id="clockButton" disabled>
          <i class="bi bi-clock me-2"></i><span id="clockButtonText">...</span>
        </button>
        <div class="text-muted small mt-2" id="locationHint"></div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
              <h5 class="card-title mb-0"><i class="bi bi-table"></i> My Timesheet</h5>
              <div class="d-flex gap-2">
                <input type="date" class="form-control form-control-sm" id="ts_from">
                <input type="date" class="form-control form-control-sm" id="ts_to">
                <button class="btn btn-sm btn-outline-primary" id="loadTimesheetBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead><tr><th>Date</th><th>Clock In</th><th>Clock Out</th><th>Status</th><th>Hours</th></tr></thead>
                <tbody id="timesheetRows"></tbody>
              </table>
            </div>
            <div id="timesheetEmptyState" class="emp-empty-state d-none">
              <i class="bi bi-calendar3 display-6 d-block mb-2"></i>
              No attendance records in this range.
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title"><i class="bi bi-wrench-adjustable"></i> Request Correction</h5>
            <form id="regularizationForm">
              <div class="mb-2">
                <label class="form-label">Date</label>
                <input type="date" class="form-control form-control-sm" id="reg_date" required>
              </div>
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <label class="form-label">Correct clock-in</label>
                  <input type="time" class="form-control form-control-sm" id="reg_clock_in">
                </div>
                <div class="col-6">
                  <label class="form-label">Correct clock-out</label>
                  <input type="time" class="form-control form-control-sm" id="reg_clock_out">
                </div>
              </div>
              <div class="mb-2">
                <label class="form-label">Reason</label>
                <textarea class="form-control form-control-sm" id="reg_reason" rows="2" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-send me-1"></i>Submit Request</button>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title"><i class="bi bi-list-check"></i> My Requests</h5>
            <ul class="list-group list-group-flush" id="regularizationList"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app-ux.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/static/js/notifications.js"></script>
  <script nonce="{{ csp_nonce }}">
    const token = sessionStorage.getItem('access_token');
    if (!token) { window.location.href = '/auth/login'; }
    const authHeader = { Authorization: 'Bearer ' + token };

    function showToast(message, variant) {
      const bg = variant === 'success' ? 'text-bg-success' : 'text-bg-danger';
      const icon = variant === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle';
      const toastEl = $(
        '<div class="toast align-items-center ' + bg + ' border-0" role="alert">' +
          '<div class="d-flex">' +
            '<div class="toast-body"><i class="bi ' + icon + ' me-2"></i>' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>' +
          '</div>' +
        '</div>'
      );
      $('#toastContainer').append(toastEl);
      const toast = new bootstrap.Toast(toastEl[0], { delay: 4000 });
      toast.show();
      toastEl.on('hidden.bs.toast', function () { toastEl.remove(); });
    }

    function showError(message) { showToast(message, 'danger'); }
    function showSuccess(message) { showToast(message, 'success'); }

    function statusBadge(status) {
      return '<span class="badge emp-status emp-status-' + status + '">' + status.replace('_', ' ') + '</span>';
    }

    function formatTime(isoString) {
      if (!isoString) return '&mdash;';
      return new Date(isoString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function getLocation() {
      return new Promise(function (resolve) {
        if (!navigator.geolocation) { resolve({}); return; }
        navigator.geolocation.getCurrentPosition(
          function (pos) { resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }); },
          function () { resolve({}); },
          { timeout: 3000 }
        );
      });
    }

    let todayState = null;

    function refreshTodayStatus() {
      $.ajax({ url: '/api/v1/attendance/today/me', headers: authHeader }).done(function (data) {
        todayState = data;
        $('#clockButton').prop('disabled', false);
        if (!data.clocked_in) {
          $('#todayStatus').text('Not clocked in yet');
          $('#clockButtonText').text('Clock In');
          $('#clockButton').removeClass('btn-danger').addClass('btn-primary');
        } else if (data.clocked_in && !data.clocked_out) {
          $('#todayStatus').html('Clocked in at ' + formatTime(data.clock_in));
          $('#clockButtonText').text('Clock Out');
          $('#clockButton').removeClass('btn-primary').addClass('btn-danger');
        } else {
          $('#todayStatus').html(
            'Clocked out at ' + formatTime(data.clock_out) + ' &mdash; ' + statusBadge(data.status)
          );
          $('#clockButtonText').text('Done for today');
          $('#clockButton').prop('disabled', true);
        }
      });
    }

    $('#clockButton').on('click', function () {
      $('#clockButton').prop('disabled', true);
      getLocation().then(function (loc) {
        const url = (todayState && todayState.clocked_in) ? '/api/v1/attendance/clock-out' : '/api/v1/attendance/clock-in';
        $.ajax({
          url: url, method: 'POST', contentType: 'application/json', headers: authHeader, data: JSON.stringify(loc)
        }).done(function () {
          refreshTodayStatus();
          loadTimesheet();
          showSuccess('Recorded successfully.');
        }).fail(function (xhr) {
          showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to record attendance.');
          $('#clockButton').prop('disabled', false);
        });
      });
    });

    function defaultDateRange() {
      const now = new Date();
      const first = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
      const today = now.toISOString().slice(0, 10);
      $('#ts_from').val(first);
      $('#ts_to').val(today);
      $('#reg_date').val(today);
    }

    function loadTimesheet() {
      const from = $('#ts_from').val();
      const to = $('#ts_to').val();
      $.ajax({ url: '/api/v1/attendance/me?from=' + from + '&to=' + to, headers: authHeader }).done(function (logs) {
        $('#timesheetEmptyState').toggleClass('d-none', logs.length > 0);
        const rows = logs.map(function (l) {
          return '<tr><td>' + l.date + '</td><td>' + formatTime(l.clock_in) + '</td><td>' + formatTime(l.clock_out) +
            '</td><td>' + statusBadge(l.status) + '</td><td>' + (l.work_hours ?? '&mdash;') + '</td></tr>';
        });
        $('#timesheetRows').html(rows.join(''));
      });
    }

    $('#loadTimesheetBtn').on('click', loadTimesheet);

    function loadRegularizations() {
      $.ajax({ url: '/api/v1/attendance/regularizations/me', headers: authHeader }).done(function (regs) {
        if (regs.length === 0) {
          $('#regularizationList').html('<li class="list-group-item text-muted small">No requests yet.</li>');
          return;
        }
        $('#regularizationList').html(regs.map(function (r) {
          return '<li class="list-group-item">' +
            '<div class="d-flex justify-content-between"><span>' + r.date + '</span>' + statusBadge(r.status) + '</div>' +
            '<div class="small text-muted">' + r.reason + '</div>' +
          '</li>';
        }).join(''));
      });
    }

    $('#regularizationForm').on('submit', function (e) {
      e.preventDefault();
      const dateVal = $('#reg_date').val();
      const clockInVal = $('#reg_clock_in').val();
      const clockOutVal = $('#reg_clock_out').val();
      const payload = {
        date: dateVal,
        requested_clock_in: clockInVal ? dateVal + 'T' + clockInVal + ':00Z' : null,
        requested_clock_out: clockOutVal ? dateVal + 'T' + clockOutVal + ':00Z' : null,
        reason: $('#reg_reason').val()
      };
      $.ajax({
        url: '/api/v1/attendance/regularizations', method: 'POST', contentType: 'application/json',
        headers: authHeader, data: JSON.stringify(payload)
      }).done(function () {
        $('#regularizationForm')[0].reset();
        defaultDateRange();
        loadRegularizations();
        showSuccess('Correction request submitted.');
      }).fail(function (xhr) {
        showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to submit request.');
      });
    });

    defaultDateRange();
    refreshTodayStatus();
    loadTimesheet();
    loadRegularizations();

    $('#logoutLink').on('click', function (e) {
      e.preventDefault();
      sessionStorage.clear();
      window.location.href = '/auth/login';
    });
  </script>
</body>
</html>
