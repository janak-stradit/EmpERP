<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Activity Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar emp-navbar mb-4">
    <div class="container">
      <a class="navbar-brand" href="/dashboard"><i class="bi bi-buildings me-2"></i><span>Stradit Workforce</span></a>
      <button class="emp-navbar-toggler ms-auto" id="empNavToggler" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>
      <div class="emp-navbar-collapse" id="empNavCollapse">
        <a class="nav-link" href="/dashboard"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <a href="/dashboard" class="btn btn-sm btn-link ps-0 mb-2"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>

    <div class="emp-page-header">
      <h1>Team Activity Dashboard</h1>
      <p>Monitor your team's logged time and productivity.</p>
    </div>

    <div class="card card-accent-info mb-4">
      <div class="card-body">
        <div class="row align-items-end mb-4">
          <div class="col-md-3">
            <label class="form-label">Week Start</label>
            <input type="date" class="form-control" id="weekStart">
          </div>
          <div class="col-md-3">
            <label class="form-label">Week End</label>
            <input type="date" class="form-control" id="weekEnd" readonly>
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary w-100" id="loadBtn">Load Data</button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle" id="teamTable">
            <thead>
              <tr>
                <th>Employee Name</th>
                <th>Regular Hours</th>
                <th>Overtime Hours</th>
                <th>Category Breakdown</th>
              </tr>
            </thead>
            <tbody>
              <!-- Filled by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app-ux.js"></script>
  <script nonce="{{ csp_nonce }}">
    const authHeader = { 'Authorization': 'Bearer ' + sessionStorage.getItem('access_token') };
    if (!sessionStorage.getItem('access_token')) {
      window.location.href = '/auth/login';
    }

    function getStartOfWeek(d) {
      const day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
      return new Date(d.setDate(diff)).toISOString().split('T')[0];
    }
    
    function setEndOfWeek(startStr) {
      const d = new Date(startStr);
      d.setDate(d.getDate() + 6);
      $('#weekEnd').val(d.toISOString().split('T')[0]);
    }

    function loadTeamSummary() {
      const start = $('#weekStart').val();
      const end = $('#weekEnd').val();
      
      $('#teamTable tbody').html('<tr><td colspan="4" class="text-center">Loading...</td></tr>');
      
      $.ajax({ url: `/api/v1/activities/team-summary?start_date=${start}&end_date=${end}`, headers: authHeader })
      .done(function(data) {
        if(data.length === 0) {
          $('#teamTable tbody').html('<tr><td colspan="4" class="text-center text-muted py-4">No team activities found for this week.<br><small>If you expect to see data, ensure you have employees mapped to you via the Super Admin Team Mapping tool.</small></td></tr>');
          return;
        }
        
        let rows = '';
        data.forEach(emp => {
          let catBadges = emp.categories.map(c => `
            <div class="d-flex justify-content-between align-items-center bg-white border rounded px-2 py-1 shadow-sm w-100 mt-1">
                <span class="small fw-medium text-secondary"><i class="bi bi-circle-fill text-success opacity-50 me-1" style="font-size:0.5rem;"></i> ${c.category_name}</span>
                <span class="small fw-bold text-dark">${c.hours}h</span>
            </div>
          `).join('');
          
          if (emp.categories.length > 0) {
            catBadges = `<div class="d-flex flex-column gap-1" style="max-width: 250px;">${catBadges}</div>`;
          }

          if(!catBadges) catBadges = '<span class="text-muted small">None</span>';
          
          rows += `<tr>
            <td class="fw-bold">${emp.employee_name}</td>
            <td>${emp.total_regular_hours}h</td>
            <td><span class="${emp.total_overtime_hours > 0 ? 'text-danger fw-bold' : ''}">${emp.total_overtime_hours}h</span></td>
            <td>${catBadges}</td>
          </tr>`;
        });
        $('#teamTable tbody').html(rows);
      })
      .fail(function() {
        $('#teamTable tbody').html('<tr><td colspan="4" class="text-center text-danger">Error loading data.</td></tr>');
      });
    }

    $(document).ready(function() {
      const today = new Date();
      const start = getStartOfWeek(today);
      $('#weekStart').val(start);
      setEndOfWeek(start);
      
      $('#weekStart').on('change', function() {
        setEndOfWeek($(this).val());
      });
      
      $('#loadBtn').on('click', loadTeamSummary);
      
      loadTeamSummary();

      $('#logoutLink').on('click', function(e) {
        e.preventDefault();
        sessionStorage.clear();
        window.location.href = '/auth/login';
      });
    });
  </script>
</body>
</html>
