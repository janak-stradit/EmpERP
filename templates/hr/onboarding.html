<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stradit Workforce &mdash; Onboarding</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar emp-navbar mb-4">
    <div class="container">
      <a class="navbar-brand" href="/dashboard"><i class="bi bi-buildings me-2"></i><span>Stradit Workforce</span></a>
      <button class="emp-navbar-toggler ms-auto" id="empNavToggler" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>
      <div class="emp-navbar-collapse" id="empNavCollapse">
        <a class="nav-link" href="/dashboard"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <a href="/dashboard" class="btn btn-sm btn-link ps-0 mb-2"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>

    <div class="emp-page-header">
      <h1>Onboarding</h1>
      <p>Build onboarding checklists, assign them to new hires, and track progress.</p>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title"><i class="bi bi-file-earmark-plus"></i> Create Template</h5>
            <form id="templateForm" class="row g-2 mt-1">
              <div class="col-12">
                <input type="text" class="form-control" id="templateName" placeholder="Template name" required>
              </div>
              <div class="col-12">
                <input type="text" class="form-control" id="templateDescription" placeholder="Description">
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Create Template</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title"><i class="bi bi-list-check"></i> Add Task to Template</h5>
            <form id="taskForm" class="row g-2 mt-1">
              <div class="col-12">
                <select class="form-select" id="taskTemplateId" required></select>
              </div>
              <div class="col-12">
                <input type="text" class="form-control" id="taskTitle" placeholder="Task title" required>
              </div>
              <div class="col-6">
                <select class="form-select" id="taskAssignedRole">
                  <option value="employee" selected>Employee</option>
                  <option value="hr">HR</option>
                </select>
              </div>
              <div class="col-6">
                <input type="number" class="form-control" id="taskDueDays" value="7" min="0">
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Task</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title"><i class="bi bi-send-check"></i> Assign Onboarding</h5>
            <form id="assignForm" class="row g-2 mt-1">
              <div class="col-12">
                <select class="form-select" id="assignEmployeeId" required></select>
              </div>
              <div class="col-12">
                <select class="form-select" id="assignTemplateId" required></select>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-success btn-sm"><i class="bi bi-send me-1"></i>Assign</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title"><i class="bi bi-graph-up"></i> Employee Onboarding Progress</h5>
            <select class="form-select mb-3" id="progressEmployeeId"></select>
            <div id="progressResult"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app-ux.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/static/js/notifications.js"></script>
  <script nonce="{{ csp_nonce }}">
    const token = sessionStorage.getItem('access_token');
    if (!token) { window.location.href = '/auth/login'; }
    const authHeader = { Authorization: 'Bearer ' + token };

    function showToast(message, variant) {
      const bg = variant === 'success' ? 'text-bg-success' : 'text-bg-danger';
      const icon = variant === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle';
      const toastEl = $(
        '<div class="toast align-items-center ' + bg + ' border-0" role="alert">' +
          '<div class="d-flex">' +
            '<div class="toast-body"><i class="bi ' + icon + ' me-2"></i>' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>' +
          '</div>' +
        '</div>'
      );
      $('#toastContainer').append(toastEl);
      const toast = new bootstrap.Toast(toastEl[0], { delay: 4000 });
      toast.show();
      toastEl.on('hidden.bs.toast', function () { toastEl.remove(); });
    }

    function showError(message) { showToast(message, 'danger'); }
    function showSuccess(message) { showToast(message, 'success'); }

    function statusBadge(status) {
      return '<span class="badge emp-status emp-status-' + status + '">' + status.replace('_', ' ') + '</span>';
    }

    function loadEmployeeDropdowns() {
      $.ajax({ url: '/api/v1/employees', headers: authHeader }).done(function (employees) {
        const options = employees.map(function (e) {
          return '<option value="' + e.id + '">' + e.employee_code + ' - ' + e.full_name + '</option>';
        }).join('');
        $('#assignEmployeeId, #progressEmployeeId').html(options);
      });
    }

    function loadTemplateDropdowns() {
      $.ajax({ url: '/api/v1/onboarding/templates', headers: authHeader }).done(function (templates) {
        const options = templates.map(function (t) {
          return '<option value="' + t.id + '">' + t.name + '</option>';
        }).join('');
        $('#taskTemplateId, #assignTemplateId').html(options);
      });
    }

    loadEmployeeDropdowns();
    loadTemplateDropdowns();

    $('#templateForm').on('submit', function (e) {
      e.preventDefault();
      $.ajax({
        url: '/api/v1/onboarding/templates',
        method: 'POST',
        contentType: 'application/json',
        headers: authHeader,
        data: JSON.stringify({ name: $('#templateName').val(), description: $('#templateDescription').val() || null })
      }).done(function () {
        $('#templateForm')[0].reset();
        loadTemplateDropdowns();
        showSuccess('Template created.');
      }).fail(function (xhr) {
        showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to create template.');
      });
    });

    $('#taskForm').on('submit', function (e) {
      e.preventDefault();
      const templateId = $('#taskTemplateId').val();
      $.ajax({
        url: '/api/v1/onboarding/templates/' + templateId + '/tasks',
        method: 'POST',
        contentType: 'application/json',
        headers: authHeader,
        data: JSON.stringify({
          title: $('#taskTitle').val(),
          assigned_to_role: $('#taskAssignedRole').val(),
          due_days: parseInt($('#taskDueDays').val(), 10)
        })
      }).done(function () {
        $('#taskForm')[0].reset();
        showSuccess('Task added.');
      }).fail(function (xhr) {
        showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to add task.');
      });
    });

    $('#assignForm').on('submit', function (e) {
      e.preventDefault();
      $.ajax({
        url: '/api/v1/onboarding/assign',
        method: 'POST',
        contentType: 'application/json',
        headers: authHeader,
        data: JSON.stringify({
          employee_id: parseInt($('#assignEmployeeId').val(), 10),
          template_id: parseInt($('#assignTemplateId').val(), 10)
        })
      }).done(function () {
        renderProgress();
        showSuccess('Onboarding assigned.');
      }).fail(function (xhr) {
        showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to assign onboarding.');
      });
    });

    function renderProgress() {
      const employeeId = $('#progressEmployeeId').val();
      if (!employeeId) return;
      $.ajax({ url: '/api/v1/onboarding/employee/' + employeeId, headers: authHeader })
        .done(function (onboardings) {
          if (onboardings.length === 0) {
            $('#progressResult').html('<div class="emp-empty-state"><i class="bi bi-clipboard-x display-6 d-block mb-2"></i>No onboarding assigned yet.</div>');
            return;
          }
          const html = onboardings.map(function (o) {
            const taskRows = o.tasks.map(function (t) {
              const btn = t.status !== 'completed'
                ? '<button class="btn btn-sm btn-outline-success complete-task" data-id="' + t.id + '"><i class="bi bi-check-lg"></i></button>'
                : '<i class="bi bi-check-circle-fill text-success"></i>';
              return '<tr><td>' + t.title + '</td><td>' + statusBadge(t.status) + '</td><td class="text-end">' + btn + '</td></tr>';
            }).join('');
            return '<div class="d-flex justify-content-between align-items-center mb-1">' +
              '<strong>' + o.progress_percent + '% complete</strong>' + statusBadge(o.status) + '</div>' +
              '<div class="progress mb-3"><div class="progress-bar" style="width: ' + o.progress_percent + '%"></div></div>' +
              '<table class="table table-sm align-middle"><tbody>' + taskRows + '</tbody></table>';
          }).join('<hr>');
          $('#progressResult').html(html);
        });
    }

    $('#progressEmployeeId').on('change', renderProgress);

    $(document).on('click', '.complete-task', function () {
      const taskId = $(this).data('id');
      $.ajax({
        url: '/api/v1/onboarding/tasks/' + taskId,
        method: 'PUT',
        contentType: 'application/json',
        headers: authHeader,
        data: JSON.stringify({ status: 'completed' })
      }).done(renderProgress);
    });

    $('#logoutLink').on('click', function (e) {
      e.preventDefault();
      sessionStorage.clear();
      window.location.href = '/auth/login';
    });
  </script>
</body>
</html>
