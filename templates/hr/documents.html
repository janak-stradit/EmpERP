<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stradit Workforce &mdash; Document Review</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand emp-navbar mb-4">
    <div class="container">
      <span class="navbar-brand"><i class="bi bi-buildings me-2"></i>Stradit Workforce &mdash; HR</span>
      <div class="navbar-nav">
        <a class="nav-link" href="/dashboard"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a class="nav-link" href="#" id="logoutLink"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </div>
  </nav>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <div class="container pb-5">
    <a href="/dashboard" class="btn btn-sm btn-link ps-0 mb-2"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>

    <div class="emp-page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h1>Document Review</h1>
        <p>Review employee-submitted documents and manage document categories.</p>
      </div>
      <button class="btn btn-outline-primary btn-sm" data-bs-toggle="offcanvas" data-bs-target="#categoriesPanel">
        <i class="bi bi-tags me-1"></i>Manage Categories
      </button>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-sm-4">
        <div class="card text-center py-2">
          <div class="fs-4 fw-semibold" id="statPending">0</div>
          <div class="text-muted small">Pending review</div>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card text-center py-2">
          <div class="fs-4 fw-semibold text-success" id="statApproved">0</div>
          <div class="text-muted small">Approved</div>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card text-center py-2">
          <div class="fs-4 fw-semibold text-danger" id="statRejected">0</div>
          <div class="text-muted small">Rejected</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h5 class="card-title mb-0"><i class="bi bi-people"></i> Employees</h5>
          <div class="input-group input-group-sm" style="max-width: 260px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="searchBox" placeholder="Search employees...">
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Employee</th><th>Email</th><th class="text-center">Total</th>
                <th class="text-center">Pending</th><th class="text-center">Approved</th>
                <th class="text-center">Rejected</th><th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="employeeRows"></tbody>
          </table>
        </div>
        <div id="emptyState" class="emp-empty-state d-none">
          <i class="bi bi-inbox display-6 d-block mb-2"></i>
          No employees or documents found.
        </div>
      </div>
    </div>
  </div>

  <!-- Categories offcanvas -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="categoriesPanel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title"><i class="bi bi-tags me-1"></i>Document Categories</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <form id="categoryForm" class="mb-3">
        <div class="mb-2">
          <input type="text" class="form-control form-control-sm" id="newCategoryName" placeholder="New category name" required>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="newCategoryMandatory">
          <label class="form-check-label small" for="newCategoryMandatory">Mandatory for every employee</label>
        </div>
        <button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-plus-lg me-1"></i>Add Category</button>
      </form>
      <ul class="list-group list-group-flush" id="categoryList"></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script nonce="{{ csp_nonce }}">
    const token = sessionStorage.getItem('access_token');
    if (!token) { window.location.href = '/auth/login'; }
    const authHeader = { Authorization: 'Bearer ' + token };

    let allEmployees = [];
    let allDocuments = [];

    function showToast(message, variant) {
      const bg = variant === 'success' ? 'text-bg-success' : 'text-bg-danger';
      const icon = variant === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle';
      const toastEl = $(
        '<div class="toast align-items-center ' + bg + ' border-0" role="alert">' +
          '<div class="d-flex">' +
            '<div class="toast-body"><i class="bi ' + icon + ' me-2"></i>' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>' +
          '</div>' +
        '</div>'
      );
      $('#toastContainer').append(toastEl);
      const toast = new bootstrap.Toast(toastEl[0], { delay: 4000 });
      toast.show();
      toastEl.on('hidden.bs.toast', function () { toastEl.remove(); });
    }

    function showError(message) { showToast(message, 'danger'); }
    function showSuccess(message) { showToast(message, 'success'); }

    function loadCategories() {
      $.ajax({ url: '/api/v1/documents/categories', headers: authHeader }).done(function (categories) {
        $('#categoryList').html(categories.map(function (c) {
          return '<li class="list-group-item d-flex justify-content-between align-items-center py-2">' +
            '<span>' + c.name + (c.is_mandatory ? ' <span class="badge bg-secondary">mandatory</span>' : '') + '</span>' +
            '<button class="btn btn-sm btn-outline-danger delete-category" data-id="' + c.id + '"><i class="bi bi-trash"></i></button></li>';
        }).join('') || '<li class="list-group-item text-muted small">No categories yet.</li>');
      });
    }

    $('#categoryForm').on('submit', function (e) {
      e.preventDefault();
      $.ajax({
        url: '/api/v1/documents/categories', method: 'POST', contentType: 'application/json', headers: authHeader,
        data: JSON.stringify({ name: $('#newCategoryName').val(), is_mandatory: $('#newCategoryMandatory').is(':checked') })
      }).done(function () {
        $('#categoryForm')[0].reset();
        loadCategories();
        showSuccess('Category added.');
      }).fail(function (xhr) { showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to add category.'); });
    });

    $(document).on('click', '.delete-category', function () {
      if (!confirm('Delete this document category?')) return;
      $.ajax({ url: '/api/v1/documents/categories/' + $(this).data('id'), method: 'DELETE', headers: authHeader })
        .done(loadCategories)
        .fail(function (xhr) { showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to delete category.'); });
    });

    function loadData() {
      $.when(
        $.ajax({ url: '/api/v1/employees', headers: authHeader }),
        $.ajax({ url: '/api/v1/documents', headers: authHeader })
      ).done(function (employeesResp, documentsResp) {
        allEmployees = employeesResp[0];
        allDocuments = documentsResp[0];
        renderEmployees();
      }).fail(function (xhr) {
        showError((xhr.responseJSON && xhr.responseJSON.detail) || 'Failed to load data.');
      });
    }

    function renderEmployees() {
      const query = ($('#searchBox').val() || '').toLowerCase();

      $('#statPending').text(allDocuments.filter(function (d) { return d.status === 'pending'; }).length);
      $('#statApproved').text(allDocuments.filter(function (d) { return d.status === 'approved'; }).length);
      $('#statRejected').text(allDocuments.filter(function (d) { return d.status === 'rejected'; }).length);

      const filtered = allEmployees.filter(function (e) {
        return (e.employee_code + ' ' + e.full_name + ' ' + e.email).toLowerCase().includes(query);
      });

      $('#emptyState').toggleClass('d-none', allEmployees.length > 0);

      const rows = filtered.map(function (e) {
        const docs = allDocuments.filter(function (d) { return d.employee_id === e.id; });
        const pending = docs.filter(function (d) { return d.status === 'pending'; }).length;
        const approved = docs.filter(function (d) { return d.status === 'approved'; }).length;
        const rejected = docs.filter(function (d) { return d.status === 'rejected'; }).length;
        return '<tr>' +
          '<td>' + e.employee_code + ' &mdash; ' + e.full_name + '</td>' +
          '<td>' + e.email + '</td>' +
          '<td class="text-center">' + docs.length + '</td>' +
          '<td class="text-center">' + (pending ? '<span class="badge emp-status emp-status-pending">' + pending + '</span>' : '&mdash;') + '</td>' +
          '<td class="text-center">' + (approved ? '<span class="badge emp-status emp-status-approved">' + approved + '</span>' : '&mdash;') + '</td>' +
          '<td class="text-center">' + (rejected ? '<span class="badge emp-status emp-status-rejected">' + rejected + '</span>' : '&mdash;') + '</td>' +
          '<td class="text-end">' +
            '<a class="btn btn-sm btn-primary" href="/hr/documents/employee/' + e.id + '">' +
              '<i class="bi bi-eye me-1"></i>View Details</a>' +
          '</td>' +
        '</tr>';
      });
      $('#employeeRows').html(rows.join(''));
    }

    $('#searchBox').on('input', renderEmployees);

    loadCategories();
    loadData();

    $('#logoutLink').on('click', function (e) {
      e.preventDefault();
      sessionStorage.clear();
      window.location.href = '/auth/login';
    });
  </script>
</body>
</html>
